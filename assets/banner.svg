<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Decorative neural network banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#24283b"/>
      <stop offset="1" stop-color="#2f2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .n { animation: pulse 3.2s ease-in-out infinite; }
      .n2 { animation-delay: 1.1s; }
      .n3 { animation-delay: 2.1s; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .n { animation: none; } }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #7aa2f7; fill-opacity: .55; }
    </style>
  </defs>

  <rect width="1000" height="200" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="200" rx="14" fill="url(#grid)"/>
  <circle cx="525" cy="100" r="260" fill="url(#glow)"/>

  <!-- connections: layer 1 -> 2 -->
  <path stroke="#7aa2f7" stroke-opacity="0.28" stroke-width="1.2" fill="none"
    d="M300 50L450 35M300 50L450 80M300 50L450 125M300 50L450 165
       M300 100L450 35M300 100L450 80M300 100L450 125M300 100L450 165
       M300 150L450 35M300 150L450 80M300 150L450 125M300 150L450 165"/>
  <!-- connections: layer 2 -> 3 -->
  <path stroke="#bb9af7" stroke-opacity="0.28" stroke-width="1.2" fill="none"
    d="M450 35L600 50M450 35L600 100M450 35L600 150
       M450 80L600 50M450 80L600 100M450 80L600 150
       M450 125L600 50M450 125L600 100M450 125L600 150
       M450 165L600 50M450 165L600 100M450 165L600 150"/>
  <!-- connections: layer 3 -> 4 -->
  <path stroke="#7dcfff" stroke-opacity="0.32" stroke-width="1.2" fill="none"
    d="M600 50L750 75M600 50L750 125M600 100L750 75M600 100L750 125M600 150L750 75M600 150L750 125"/>

  <!-- nodes -->
  <g fill="#1a1b27" stroke="#7aa2f7" stroke-width="2">
    <circle cx="300" cy="50" r="7"/><circle cx="300" cy="100" r="7"/><circle cx="300" cy="150" r="7"/>
  </g>
  <g fill="#1a1b27" stroke="#bb9af7" stroke-width="2">
    <circle class="n" cx="450" cy="35" r="7"/><circle class="n n2" cx="450" cy="80" r="7"/>
    <circle class="n n3" cx="450" cy="125" r="7"/><circle class="n" cx="450" cy="165" r="7"/>
  </g>
  <g fill="#1a1b27" stroke="#7aa2f7" stroke-width="2">
    <circle cx="600" cy="50" r="7"/><circle cx="600" cy="100" r="7"/><circle cx="600" cy="150" r="7"/>
  </g>
  <g fill="#7dcfff" stroke="#7dcfff" stroke-width="2">
    <circle class="n n2" cx="750" cy="75" r="7"/><circle class="n n3" cx="750" cy="125" r="7"/>
  </g>

  <!-- decorative code -->
  <text class="code" x="40" y="105">&gt;&gt;&gt; model.fit(X, y)</text>
  <text class="code" x="790" y="105">&gt;&gt;&gt; model.predict(X)</text>

  <!-- accent line -->
  <path d="M30 188H970" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</svg>
